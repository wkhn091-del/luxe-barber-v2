<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luxe Barber — booking & admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08080A; --plate:#131317; --well:#0D0D10;
  --brass:#B98B3E; --brass-lit:#D6A855; --brass-dim:#6E5426;
  --champagne:#E9DCC0; --bone:#F2EFE9; --ash:#8A8A92; --smoke:#4A4A52; --signal:#E0533D;
  --lux:cubic-bezier(.16,1,.3,1);
  --display:"Bodoni Moda",Didot,Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:#050506;color:var(--bone);font-family:var(--sans);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:1px solid var(--brass);outline-offset:2px}
::selection{background:var(--brass);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Phone frame on desktop; full bleed on a phone, which is where this lives. */
#phone{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--ink);position:relative;overflow:hidden}
@media(min-width:520px){#phone{margin:24px auto;min-height:860px;height:860px;border-radius:28px;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 120px -40px #000;overflow:hidden}}
#scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:110px}

.display{font-family:var(--display);font-variation-settings:'opsz' 72}
.d3{font-size:1.6rem;line-height:1.12;letter-spacing:-.015em}
.note{font-size:.8125rem;line-height:1.25rem;color:var(--ash)}
.micro{font-size:.6875rem;letter-spacing:.04em;color:var(--ash)}
.pad{padding-left:20px;padding-right:20px}

/* segmented control — demo chrome, not part of the product */
#seg{position:sticky;top:0;z-index:40;display:flex;gap:4px;padding:10px 20px;
  background:rgba(8,8,10,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
#seg button{flex:1;border:1px solid rgba(255,255,255,.08);background:none;color:var(--smoke);
  border-radius:999px;padding:7px;font-size:.6875rem;letter-spacing:.04em;cursor:pointer;transition:all .4s var(--lux)}
#seg button[aria-pressed=true]{border-color:var(--brass);color:var(--brass);background:rgba(185,139,62,.1)}

/* timeline */
.row{display:flex;gap:14px;width:100%;padding:16px 20px;text-align:left;background:none;border:0;cursor:pointer;
  transition:background-color .3s var(--lux)}
.row:active{background:rgba(255,255,255,.03)}
.row .t{width:46px;flex-shrink:0;text-align:right;font-size:.8125rem;color:var(--ash);padding-top:2px}
.row .rail{width:2px;flex-shrink:0;border-radius:2px}
.row .body{flex:1;display:flex;justify-content:space-between;gap:12px;min-width:0}
.rail-confirmed{background:var(--brass)}
.rail-completed{background:var(--smoke)}
.rail-pending{background:rgba(138,138,146,.4)}
.rail-gap{background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.14) 0 4px,transparent 4px 10px)}
.rail-block{background:rgba(255,255,255,.06)}
@keyframes ticking{to{background-position:0 -12px}}
.rail-held{animation:ticking .9s linear infinite}
.pill{border:1px solid rgba(185,139,62,.4);color:var(--brass);border-radius:999px;padding:4px 12px;
  font-size:.6875rem;letter-spacing:.04em;white-space:nowrap}

/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:45;border-top:1px solid rgba(255,255,255,.07);
  background:rgba(19,19,23,.96);backdrop-filter:blur(12px);
  padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;align-items:center;padding-left:8px;padding-right:8px}
#tabs .tab{flex:1;background:none;border:0;padding:16px 0;font-size:.8125rem;color:var(--smoke);cursor:pointer;
  transition:color .4s var(--lux)}
#tabs .tab[aria-current=true]{color:var(--bone)}
#tabs .fab{width:56px;height:56px;margin:-24px 8px 0;border:0;border-radius:999px;background:var(--brass);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;
  box-shadow:0 10px 30px -10px rgba(185,139,62,.7);transition:transform .4s var(--lux)}
#tabs .fab:active{transform:scale(.94)}

/* sheet */
#veil{position:absolute;inset:0;z-index:60;background:rgba(8,8,10,.8);backdrop-filter:blur(4px);display:none}
#veil.on{display:block;animation:fade .3s var(--lux)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--plate);
  border-top:1px solid rgba(255,255,255,.08);border-radius:14px 14px 0 0;display:none;
  max-height:86%;touch-action:pan-y}
#sheet.on{display:block;animation:up .42s var(--lux) both}
@keyframes up{from{transform:translate3d(0,100%,0)}to{transform:none}}
#sheet .grab{display:flex;justify-content:center;padding:12px 0 4px}
#sheet .grab i{width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,.15)}
#sheet h2{font-size:1rem;font-weight:400;padding:8px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
#sheet .inner{padding:20px;overflow-y:auto;overscroll-behavior:contain;max-height:62vh}

.act{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.07);background:none;
  border-radius:2px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .4s var(--lux)}
.act:hover{border-color:rgba(255,255,255,.2)}
.act.primary{border-color:rgba(185,139,62,.5)}
.act.primary b{color:var(--brass)}
.act b{display:block;font-weight:400;font-size:1rem;color:var(--bone)}
.act span{display:block;font-size:.8125rem;color:var(--ash);margin-top:4px}

.btn{width:100%;border:0;border-radius:999px;background:var(--brass);color:var(--ink);
  padding:15px;font-size:1rem;font-weight:500;cursor:pointer;transition:background-color .4s var(--lux),transform .4s var(--lux)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4}
.btn.ghost{background:none;border:1px solid rgba(185,139,62,.5);color:var(--brass)}
.quote{border:1px solid rgba(255,255,255,.07);background:var(--well);border-radius:2px;
  padding:16px;font-size:.8125rem;line-height:1.5;color:var(--ash)}

/* booking */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-left:20px;padding-right:20px}
.day{width:72px;flex-shrink:0;border:1px solid rgba(255,255,255,.07);border-radius:2px;background:none;
  padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  transition:border-color .4s var(--lux),background-color .4s var(--lux)}
.day[aria-checked=true]{border-color:var(--brass);background:rgba(185,139,62,.1)}
.day .n{font-family:var(--display);font-variation-settings:'opsz' 72;font-size:1.25rem;line-height:1;color:var(--bone)}
.day .c{font-size:.6875rem;color:var(--brass)}
.day .c.full{color:var(--champagne)}
.day.closed{opacity:.3;cursor:default}
.day.closed .c{color:var(--smoke)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.time{border:1px solid rgba(255,255,255,.07);border-radius:2px;background:none;padding:12px 0;cursor:pointer;
  transition:all .4s var(--lux)}
.time[aria-pressed=true]{border-color:var(--brass);background:var(--brass);color:var(--ink)}
.fld{width:100%;border:1px solid rgba(255,255,255,.07);background:var(--well);border-radius:2px;
  padding:14px 16px;margin-top:8px}
.fld::placeholder{color:var(--smoke)}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.07);border-radius:999px;background:none;color:var(--ash);
  padding:8px 16px;font-size:.8125rem;cursor:pointer;transition:all .4s var(--lux)}
.chip[aria-pressed=true]{border-color:var(--brass);background:rgba(185,139,62,.1);color:var(--bone)}
.dchip{flex:1;height:40px;border:1px solid rgba(255,255,255,.07);border-radius:2px;background:none;
  color:var(--smoke);font-size:.8125rem;cursor:pointer;transition:all .4s var(--lux)}
.dchip[aria-pressed=true]{border-color:var(--brass);background:rgba(185,139,62,.1);color:var(--bone)}

/* gallery */
.slot{position:relative;aspect-ratio:4/5;width:100%;border:1px dashed rgba(255,255,255,.15);border-radius:2px;
  background:none;cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:border-color .4s var(--lux)}
.slot.filled{border-style:solid;border-color:rgba(185,139,62,.4)}
.slot img,.slot svg.fill{width:100%;height:100%;object-fit:cover;display:block}
.ba{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:2px;border:1px solid rgba(255,255,255,.07);
  background:var(--well);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.ba .lay{position:absolute;inset:0}.ba .lay svg,.ba .lay img{width:100%;height:100%;object-fit:cover;display:block}
.ba .bef{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.ba .div{position:absolute;top:0;bottom:0;width:1px;background:rgba(233,220,192,.8);left:var(--pos);pointer-events:none}
.ba .grip{position:absolute;top:50%;left:var(--pos);transform:translate3d(-50%,-50%,0);width:40px;height:40px;
  border-radius:999px;display:grid;place-items:center;border:1px solid rgba(185,139,62,.7);
  background:rgba(8,8,10,.7);backdrop-filter:blur(4px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="phone">
  <div id="seg">
    <button id="seg-admin" aria-pressed="true">Barber</button>
    <button id="seg-client" aria-pressed="false">Client</button>
  </div>
  <div id="scroll"><div id="view"></div></div>
  <nav id="tabs"></nav>
  <div id="veil"></div>
  <div id="sheet"><div class="grab"><i></i></div><h2 id="sheet-title"></h2><div class="inner" id="sheet-body"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const hhmm=d=>new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
const dur=m=>m<60?`${m} min`:(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${Math.floor(m/60)}h`);
const at=(h,m=0)=>{const d=new Date();d.setHours(h,m,0,0);return d;};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------------------------------------------------------------
   Mock state. In the real app every one of these comes from the
   admin API built in step 2.
   --------------------------------------------------------------- */
const state={
  mode:'admin', tab:'today',
  open:[{s:at(9),e:at(13)},{s:at(14),e:at(19)}],
  blocks:[],
  appts:[
    {id:'a1',start:at(9),end:at(9,50),status:'COMPLETED',name:'Idris Camara',svc:'Signature cut',price:45},
    {id:'a2',start:at(10),end:at(11),status:'CONFIRMED',name:'Tom Lefevre',svc:'Cut and beard',price:65},
    // Holds carry an absolute deadline, exactly like the server's
    // holdExpiresAt. Everything else is derived from it.
    {id:'a3',start:at(15),end:at(15,50),status:'HELD',name:'Marc Dubois',vip:true,svc:'Signature cut',price:45,
      hold:new Date(Date.now()+185000)},
    {id:'a4',start:at(17,30),end:at(18,30),status:'CONFIRMED',name:'Yanis Haddad',svc:'Cut and beard',price:65},
  ],
  queue:[
    {n:'Marc Dubois',vip:true,svc:'Signature cut',pref:'ANY',missed:0,offer:true},
    {n:'Sofiane Bakri',svc:'Cut and beard',pref:'EVENING',missed:0},
    {n:'Léo Marchand',svc:'Express fade',pref:'MORNING',missed:1},
    {n:'Hugo Petit',svc:'Signature cut',pref:'ANY',missed:0},
  ],
  gallery:[{id:'g1',cap:'Grown-out shag to a skin fade',published:true}],
  shot:{before:null,after:null},
  booking:{day:1,time:null,step:'when',pref:'ANY',mask:127},
};

/* Timeline: appointments and, crucially, the gaps between them. The empty
   space is the actionable thing in a barber's day. */
function timeline(){
  const busy=state.appts.filter(a=>['HELD','PENDING','CONFIRMED','COMPLETED'].includes(a.status))
    .map(a=>({s:a.start,e:a.end}));
  let free=state.open.map(o=>({...o}));
  for(const cut of [...busy,...state.blocks]){
    const next=[];
    for(const iv of free){
      if(cut.e<=iv.s||cut.s>=iv.e){next.push(iv);continue}
      if(cut.s>iv.s)next.push({s:iv.s,e:cut.s});
      if(cut.e<iv.e)next.push({s:cut.e,e:iv.e});
    }
    free=next;
  }
  const rows=[
    ...state.appts.map(a=>({kind:'appointment',s:a.start,e:a.end,a})),
    ...state.blocks.map(b=>({kind:'block',s:b.s,e:b.e,b})),
    // Turnaround slivers aren't openings; showing them would bury the real gaps.
    ...free.filter(iv=>(iv.e-iv.s)/60000>=20).map(iv=>({kind:'gap',s:iv.s,e:iv.e})),
  ].sort((x,y)=>x.s-y.s);
  return rows.map(r=>({...r,min:Math.round((r.e-r.s)/60000)}));
}

/* ======================== ADMIN — TODAY ======================== */
function renderToday(){
  const rows=timeline();
  const booked=state.appts.filter(a=>['CONFIRMED','HELD','COMPLETED'].includes(a.status));
  const bMin=booked.reduce((s,a)=>s+(a.end-a.start)/60000,0);
  const gMin=rows.filter(r=>r.kind==='gap').reduce((s,r)=>s+r.min,0);
  const fill=bMin+gMin?Math.round(bMin/(bMin+gMin)*100):100;
  const take=booked.filter(a=>a.status!=='HELD').reduce((s,a)=>s+a.price,0);
  const next=booked.filter(a=>a.start>new Date()&&a.status==='CONFIRMED').sort((a,b)=>a.start-b.start)[0];

  return `
  <header class="pad" style="padding-top:24px">
    <p class="note">${new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</p>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px">
      <div>
        <!-- Bodoni's single appearance on this screen. -->
        <span class="display" style="font-size:3.25rem;line-height:1">${fill}%</span>
        <p class="note" style="margin-top:4px">of today's chairs filled</p>
      </div>
      <div style="text-align:right">
        <p style="color:var(--brass)">€${take}</p>
        <p class="micro" style="color:var(--smoke);margin-top:4px">${booked.length} in the chair</p>
      </div>
    </div>
    ${next?`<p class="note" style="margin-top:20px;border-top:1px solid rgba(255,255,255,.07);padding-top:16px">
      Next: <span style="color:var(--bone)">${esc(next.name)}</span> at ${hhmm(next.start)} ·
      ${Math.max(0,Math.round((next.start-Date.now())/60000))} min</p>`:''}
  </header>
  <div style="margin-top:24px">${rows.map(rowHtml).join('')}</div>`;
}

function rowHtml(r){
  if(r.kind==='gap') return `
    <button class="row" data-gap="${r.s.getTime()}">
      <span class="t" style="color:var(--smoke)">${hhmm(r.s)}</span>
      <span class="rail rail-gap"></span>
      <span class="body" style="align-items:center">
        <span class="note">Open · ${dur(r.min)}</span><span class="pill">Fill it</span>
      </span></button>`;

  if(r.kind==='block') return `
    <div class="row" style="cursor:default">
      <span class="t" style="color:var(--smoke)">${hhmm(r.s)}</span>
      <span class="rail rail-block"></span>
      <span class="body"><span class="note" style="color:var(--smoke)">Blocked · ${dur(r.min)}</span></span></div>`;

  const a=r.a, held=a.status==='HELD';
  const left=held?Math.max(0,Math.round((a.hold-Date.now())/1000)):null;
  // The same red the client is staring at, at the same moment.
  const crit=left!==null&&left<=60;
  const rail=held
    ? `<span class="rail rail-held" style="background-image:repeating-linear-gradient(to bottom,${crit?'#E0533D':'#E9DCC0'} 0 6px,transparent 6px 12px)"></span>`
    : `<span class="rail rail-${a.status.toLowerCase()}"></span>`;

  return `
    <button class="row" data-appt="${a.id}">
      <span class="t">${hhmm(a.start)}</span>${rail}
      <span class="body">
        <span style="min-width:0">
          <span style="display:block;color:${a.status==='COMPLETED'?'var(--ash)':'var(--bone)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${esc(a.name)}${a.vip?'<span class="micro" style="color:var(--brass);margin-left:8px">VIP</span>':''}
          </span>
          <span class="note" style="display:block;margin-top:4px">${esc(a.svc)} · ${dur(r.min)}</span>
        </span>
        <span style="flex-shrink:0;text-align:right">
          ${held
            ? `<span style="display:block;color:${crit?'var(--signal)':'var(--champagne)'}">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>
               <span class="micro" style="display:block;color:var(--smoke);margin-top:4px">holding</span>`
            : `<span class="note" style="display:block;color:var(--brass)">€${a.price}</span>
               <span class="micro" style="display:block;color:var(--smoke);margin-top:4px">${a.status.toLowerCase()}</span>`}
        </span>
      </span></button>`;
}

/* ======================== ADMIN — QUEUE ======================== */
function renderQueue(){
  const live=state.queue.filter(q=>q.offer), wait=state.queue.filter(q=>!q.offer);
  const held=state.appts.find(a=>a.status==='HELD');
  const left=held?Math.max(0,Math.round((held.hold-Date.now())/1000)):0;
  return `
  <div class="pad" style="padding-top:24px">
    <h1 class="display d3">Queue</h1>
    <p class="note" style="margin-top:8px">${state.queue.length} waiting. They're offered slots one at a time, in this order.</p>
    ${live.length&&held?`
      <div style="margin-top:24px;border:1px solid rgba(185,139,62,.3);border-radius:2px;padding:16px;
        display:flex;justify-content:space-between;align-items:center;gap:16px">
        <div style="min-width:0">
          <p style="color:var(--bone)">${esc(live[0].n)}</p>
          <p class="note" style="margin-top:4px">Offered ${hhmm(held.start)} · person 1 on this slot</p>
        </div>
        <span style="color:${left<=60?'var(--signal)':'var(--champagne)'};flex-shrink:0">
          ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>
      </div>`:''}
    <div style="margin-top:24px">
      ${wait.map((q,i)=>`
        <div style="display:flex;gap:16px;align-items:center;border-top:1px solid rgba(255,255,255,.07);padding:16px 0">
          <span class="note" style="width:24px;text-align:right;color:var(--smoke)">${i+2}</span>
          <div style="flex:1;min-width:0">
            <p style="color:var(--bone)">${esc(q.n)}${q.vip?'<span class="micro" style="color:var(--brass);margin-left:8px">VIP</span>':''}</p>
            <p class="note" style="margin-top:4px">${esc(q.svc)}${q.pref!=='ANY'?' · '+q.pref.toLowerCase()+'s':''}${q.missed?` · ${q.missed} missed`:''}</p>
          </div>
          <span class="pill" style="border-color:rgba(255,255,255,.07);color:var(--ash)">Call</span>
        </div>`).join('')}
      <div style="border-top:1px solid rgba(255,255,255,.07)"></div>
    </div>
  </div>`;
}

/* ======================= ADMIN — GALLERY ======================= */
/* Silhouettes stand in for photographs: a published page can't load remote
   images, and the shape change is what the slider is actually for. */
const SIL=(hair)=>`<svg class="fill" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs><radialGradient id="g${hair}" cx="60%" cy="32%" r="80%">
    <stop offset="0%" stop-color="${hair==='before'?'#141519':'#241b10'}"/><stop offset="100%" stop-color="#0A0A0C"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#15131a"/><stop offset="60%" stop-color="#15131a"/>
    <stop offset="100%" stop-color="#15131a" stop-opacity="0"/></linearGradient></defs>
  <rect width="400" height="500" fill="url(#g${hair})"/>
  <g transform="translate(60,10) scale(0.42)">
    <path d="M330 168C390 170 438 215 442 280C446 340 430 380 424 418L424 440C470 470 545 500 580 545L600 620L600 750L0 750L0 640C40 570 140 520 230 480C262 466 288 452 300 436C286 424 262 410 250 396C236 382 224 368 226 352C228 342 214 336 206 326C198 316 212 300 228 288C238 280 232 268 236 256C244 226 268 186 330 168Z" fill="${hair==='before'?'#101116':'#0E0D11'}"/>
    ${hair==='before'
      ? `<path d="M226 262C200 150 280 84 360 92C452 100 492 178 480 266C474 320 486 372 492 424C496 452 470 462 462 436C452 404 456 364 448 330C442 300 444 280 440 268C436 214 400 174 344 172C292 170 254 208 250 264Z" fill="#191A20"/>
         <g stroke="#232430" stroke-width="3" stroke-linecap="round" fill="none">
           <path d="M262 132C250 112 246 96 252 82"/><path d="M318 106C312 84 316 68 328 58"/>
           <path d="M386 108C392 86 406 74 420 70"/><path d="M448 152C466 138 482 136 494 142"/></g>`

/* Drag to dismiss, written straight to style inside rAF. */
(function(){
  const sheet=$('#sheet'); let active=false,startY=0,off=0,raf=0;
  const paint=()=>{raf=0;sheet.style.transform=`translate3d(0,${off}px,0)`};
  sheet.addEventListener('pointerdown',e=>{
    if($('#sheet-body').scrollTop>0)return;
    active=true;startY=e.clientY;off=0;sheet.style.transition='none';sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove',e=>{
    if(!active)return; off=Math.max(0,e.clientY-startY); if(!raf)raf=requestAnimationFrame(paint);
  });
  const end=e=>{
    if(!active)return; active=false; sheet.releasePointerCapture?.(e.pointerId);
    sheet.style.transition='transform .42s var(--lux)'; sheet.style.transform='translate3d(0,0,0)';
    if(off>96)closeSheet(); off=0;
  };
  sheet.addEventListener('pointerup',end); sheet.addEventListener('pointercancel',end);
})();

/* One interval for the whole screen — every holding row computes its own
   remaining seconds from its own deadline during the render it triggers. */
setInterval(()=>{
  const held=state.appts.find(a=>a.status==='HELD');
  if(held&&held.hold<=new Date()){
    // Timeout: the hold releases and the slot becomes an opening again —
    // which is exactly what the server's cascade does before re-offering it.
    state.appts=state.appts.filter(a=>a.id!==held.id);
    state.queue=state.queue.map(q=>q.offer?{...q,offer:false,missed:q.missed+1}:q);
  }
  if(state.mode==='admin'&&(state.tab==='today'||state.tab==='queue')&&!$('#sheet').classList.contains('on')) render();
},1000);

/* Before/after drag, same technique as the public slider. */
function wireSlider(){
  const el=$('#ba'); if(!el)return;
  const grip=el.querySelector('.grip'),div=el.querySelector('.div');
  let pend=52,raf=0,drag=false;
  const commit=()=>{raf=0;el.style.setProperty('--pos',pend+'%')};
  const set=v=>{pend=Math.max(0,Math.min(100,v));if(!raf)raf=requestAnimationFrame(commit)};
  const fromX=x=>{const r=el.getBoundingClientRect();return r.width?((x-r.left)/r.width)*100:null};
  el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);const v=fromX(e.clientX);if(v!==null)set(v)});
  el.addEventListener('pointermove',e=>{if(!drag)return;const v=fromX(e.clientX);if(v!==null)set(v)});
  const end=e=>{drag=false;el.releasePointerCapture?.(e.pointerId)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-gap],[data-appt],#fab,[data-a],[data-s],[data-open],[data-book],[data-d],[data-t],[data-wl],[data-pref],[data-day],[data-pick],[data-toggle],#bk-next,#bk-back,#bk-submit,#bk-queue,#publish,#sheet-close');
  if(!t)return;

  if(t.dataset.tab){state.tab=t.dataset.tab;render();return}
  if(t.id==='fab'){openWindowSheet();return}
  if(t.dataset.gap){gapSheet(t.dataset.gap);return}
  if(t.dataset.appt){apptSheet(t.dataset.appt);return}
  if(t.id==='sheet-close'){closeSheet();state.booking={day:1,time:null,step:'when',pref:'ANY',mask:127};return}

  /* gap actions */
  if(t.dataset.a==='flash'){flashReview(sheetCtx);return}
  if(t.dataset.a==='cancel'){gapSheet(sheetCtx.s.getTime());return}
  if(t.dataset.a==='leave'){closeSheet();return}
  if(t.dataset.a==='block'){state.blocks.push({s:sheetCtx.s,e:sheetCtx.e});closeSheet();render();return}
  if(t.dataset.a==='send'){
    openSheet(null,`<div style="text-align:center;padding:8px 0 24px">
      <h2 class="display d3">Sent to 47</h2>
      <p class="note" style="margin-top:16px">First to book takes it — nothing is held. You'll see it land on the timeline.</p>
      <button class="btn ghost" id="sheet-close" style="margin-top:32px">Back to today</button></div>`);
    return}

  /* appointment status */
  if(t.dataset.s){
    const a=sheetCtx;
    if(t.dataset.s==='CANCELLED') state.appts=state.appts.filter(x=>x.id!==a.id);
    else a.status=t.dataset.s;
    closeSheet();render();return}

  /* open hours */
  if(t.dataset.open){
    const p=sheetCtx.find(x=>x.k===t.dataset.open);
    state.open.push({s:p.s,e:p.e});
    state.blocks=state.blocks.filter(b=>!(b.s>=p.s&&b.e<=p.e));
    openSheet(null,`<div style="text-align:center;padding:8px 0 24px">
      <h2 class="display d3">2 offers sent</h2>
      <p class="note" style="margin-top:16px">${hhmm(p.s)} – ${hhmm(p.e)} is live on the site. The queue has been messaged, one person per slot. Each has fifteen minutes.</p>
      <button class="btn ghost" id="sheet-close" style="margin-top:32px">Back to today</button></div>`);
    state.tab='today';render();return}

  /* gallery */
  if(t.dataset.pick){
    const k=t.dataset.pick;
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.capture='environment';
    inp.onchange=async()=>{
      const f=inp.files?.[0]; if(!f){state.shot[k]={url:null};render();return}
      // Real downscale: 12MP off a phone is 5MB; 1600px at q0.82 is ~250KB.
      try{
        const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
        const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
        const c=document.createElement('canvas');c.width=bmp.width*s|0;c.height=bmp.height*s|0;
        c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
        state.shot[k]={url:c.toDataURL('image/jpeg',.82)};
      }catch{ state.shot[k]={url:null}; }
      render();
    };
    inp.click();
    // No file chosen is still a valid demo: fall back to the silhouette.
    state.shot[k]=state.shot[k]||{url:null};render();return}
  if(t.id==='publish'){
    state.gallery.push({id:'g'+Date.now(),cap:$('#cap').value||'New cut',published:true});
    state.shot={before:null,after:null};render();return}
  if(t.dataset.toggle){
    const g=state.gallery.find(x=>x.id===t.dataset.toggle);g.published=!g.published;render();return}

  /* booking */
  if(t.dataset.book){state.booking={day:1,time:null,step:'when',pref:'ANY',mask:127};
    openSheet('Signature cut',renderBooking());return}
  if(t.dataset.d!==undefined&&t.classList.contains('day')){
    const i=Number(t.dataset.d);state.booking.day=i;state.booking.time=null;
    // Tapping a full day IS the waitlist entry point.
    if(DAYS[i].full)state.booking.step='waitlist';
    openSheet(state.booking.step==='waitlist'?'Join the queue':'Signature cut',renderBooking());return}
  if(t.dataset.t){state.booking.time=t.dataset.t;openSheet('Signature cut',renderBooking());return}
  if(t.dataset.wl){state.booking.step='waitlist';state.booking.pref=t.dataset.wl;
    openSheet('Join the queue',renderBooking());return}
  if(t.dataset.pref){state.booking.pref=t.dataset.pref;openSheet('Join the queue',renderBooking());return}
  if(t.dataset.day){
    const bit=1<<(Number(t.dataset.day)-1);const next=state.booking.mask^bit;
    // Never let the mask reach zero — an entry matching no weekday would sit
    // in the queue forever.
    state.booking.mask=next===0?bit:next;
    openSheet('Join the queue',renderBooking());return}
  if(t.id==='bk-next'){state.booking.step='who';openSheet('Your details',renderBooking());return}
  if(t.id==='bk-back'){state.booking.step='when';openSheet('Signature cut',renderBooking());return}
  if(t.id==='bk-submit'){state.booking.step='done';openSheet(null,renderBooking());return}
  if(t.id==='bk-queue'){state.booking.step='queued';openSheet(null,renderBooking());return}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
